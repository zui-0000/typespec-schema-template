# 入れるときにスクリプト（postinstall など）を動かしてよいパッケージ。false は動かさない
allowBuilds:
  lefthook: true

# 同じパッケージが複数の版で入っていて、1 つの版で全員の範囲を満たせるなら、その版にまとめる
autoDedupe: true

# 公開から 2 日（2880 分）たっていない版は入れない。
minimumReleaseAge: 2880

# 前に公開された版より、公開の証明（trusted publishing・provenance）が弱い版は入れない
trustPolicy: no-downgrade

# trustPolicy の対象から外す版
trustPolicyExclude:
  # CI 失敗でメンテナが手動公開したため provenance なし（evilmartians/lefthook#1600）
  - 'lefthook@2.2.2'

# lockfile が使わなくなった trustPolicyExclude の項目を install のときに自動で消す
trustPolicyExcludePrune: true

# autoDedupe などの解決設定を pnpm-lock.yaml に記録する。記録がないと、frozen でない install の
# たびに lockfile を解決し直す。pnpm 12.10.0 より前の版はこの設定を読めない
lockfile:
  includeResolutionSettings: true
