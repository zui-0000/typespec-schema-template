# インストール時にスクリプトを実行してよいパッケージ
# - lefthook: postinstall は lefthook install を呼ぶだけで、package.json の prepare と重複するので不要
allowBuilds:
  lefthook: false

# pnpm add で版を固定して書く（^ を付けない）。版が動くのを、上げたときだけにするため
savePrefix: ""

# 1 つの版で全員の範囲を満たせるなら、その版にまとめる（既定は false）
autoDedupe: true

# サプライチェーン攻撃への備え。公開から 1 日たっていない版は入れない
minimumReleaseAge: 1440

# 以前の版より公開の証明（provenance など）が弱い版は入れない
trustPolicy: no-downgrade
# 例外は版まで書き、上げるたびに確かめ直す
# - lefthook: CI 失敗でメンテナが手動公開したため provenance がない（evilmartians/lefthook#1600）
trustPolicyExclude:
  - "lefthook@2.2.2"
# 使われなくなった trustPolicyExclude の項目を install のときに消す
trustPolicyExcludePrune: true

# autoDedupe などの解決設定を lockfile に記録する。ないと frozen でない install のたびに解決し直す
lockfile:
  includeResolutionSettings: true
