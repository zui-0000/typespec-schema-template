openapi: 3.2.0
info:
  title: Foo Backend API
  version: 0.0.0
tags:
  - name: Products
paths:
  /products:
    get:
      operationId: listProducts
      description: 全商品を取得する
      parameters:
        - name: currentPage
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/CurrentPage'
          explode: false
        - name: perPage
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/PerPage'
          explode: false
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListProductsResponse'
        '500':
          description: サーバーエラー
      tags:
        - Products
    post:
      operationId: createProduct
      description: 商品を新規作成する
      parameters: []
      responses:
        '201':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateProductResponse'
        '400':
          description: リクエスト内容が不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestException'
        '500':
          description: サーバーエラー
      tags:
        - Products
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
  /products/{id}:
    get:
      operationId: getProduct
      description: IDを指定して商品を取得する
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ProductId'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetProductResponse'
        '404':
          description: リソースが見つからない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceNotFoundException'
        '500':
          description: サーバーエラー
      tags:
        - Products
components:
  schemas:
    BadRequestException:
      type: object
      required:
        - errorCode
        - message
      properties:
        errorCode:
          $ref: '#/components/schemas/ErrorCode'
        message:
          $ref: '#/components/schemas/ErrorMessage'
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
      description: リクエスト内容が不正
      title: BadRequestException
      examples:
        - errorCode: '4000'
          message: BadRequestException
          details:
            - field: email
              message: メールアドレスの形式が不正です
    CreateProductRequest:
      type: object
      required:
        - name
        - price
      properties:
        name:
          $ref: '#/components/schemas/ProductName'
        price:
          $ref: '#/components/schemas/ProductPrice'
      title: CreateProductRequest
    CreateProductResponse:
      type: object
      required:
        - id
      properties:
        id:
          $ref: '#/components/schemas/ProductId'
      title: CreateProductResponse
    CurrentPage:
      type: integer
      minimum: 1
      description: 現在のページ番号
      title: CurrentPage
    ErrorCode:
      type: string
      description: エラーコード
      title: ErrorCode
      examples:
        - '4000'
    ErrorDetail:
      type: object
      required:
        - field
        - message
      properties:
        field:
          type: string
        message:
          type: string
      description: バリデーションエラーの詳細
      title: ErrorDetail
    ErrorMessage:
      type: string
      description: エラーメッセージ
      title: ErrorMessage
      examples:
        - BadRequestException
    GetProductResponse:
      type: object
      required:
        - id
        - name
        - price
      properties:
        id:
          $ref: '#/components/schemas/ProductId'
        name:
          $ref: '#/components/schemas/ProductName'
        price:
          $ref: '#/components/schemas/ProductPrice'
      title: GetProductResponse
    ListProductsPagination:
      type: object
      required:
        - totalCount
        - totalPages
        - currentPage
        - perPage
      properties:
        totalCount:
          $ref: '#/components/schemas/TotalCount'
        totalPages:
          $ref: '#/components/schemas/TotalPages'
        currentPage:
          $ref: '#/components/schemas/CurrentPage'
        perPage:
          $ref: '#/components/schemas/PerPage'
      title: ListProductsPagination
    ListProductsResponse:
      type: object
      required:
        - products
        - pagination
      properties:
        products:
          type: array
          items:
            $ref: '#/components/schemas/ListProductsResult'
        pagination:
          $ref: '#/components/schemas/ListProductsPagination'
      title: ListProductsResponse
    ListProductsResult:
      type: object
      required:
        - id
        - name
        - price
      properties:
        id:
          $ref: '#/components/schemas/ProductId'
        name:
          $ref: '#/components/schemas/ProductName'
        price:
          $ref: '#/components/schemas/ProductPrice'
      title: ListProductsResult
    PerPage:
      type: integer
      minimum: 1
      description: 1ページあたりの件数
      title: PerPage
    ProductId:
      type: string
      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
      description: 商品ID (UUID v7)
      title: ProductId
      examples:
        - 018eef15-1234-7123-8123-123456789abc
    ProductName:
      type: string
      minLength: 1
      maxLength: 100
      description: 商品名
      title: ProductName
      examples:
        - TypeSpec入門書
    ProductPrice:
      type: integer
      minimum: 0
      description: 商品価格（円）
      title: ProductPrice
      examples:
        - 1980
    ResourceNotFoundException:
      type: object
      required:
        - errorCode
        - message
      properties:
        errorCode:
          $ref: '#/components/schemas/ErrorCode'
        message:
          $ref: '#/components/schemas/ErrorMessage'
      description: リソースが存在しない
      title: ResourceNotFoundException
      examples:
        - errorCode: '4040'
          message: ResourceNotFoundException
    TotalCount:
      type: integer
      minimum: 0
      description: 総件数
      title: TotalCount
    TotalPages:
      type: integer
      minimum: 0
      description: 総ページ数
      title: TotalPages
